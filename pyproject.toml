[project]
name = "share-settle-backend"
version = "0.1.0"
description = "FastAPI backend for Share & Settle"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<0.28",
  "anyio>=4.4,<4.10",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
